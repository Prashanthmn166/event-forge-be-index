<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCX Dynamic URL Generator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #667085;
      font-size: 14px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      color: #172033;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus,
    select:focus {
      border-color: #3867d6;
      box-shadow: 0 0 0 3px rgba(56, 103, 214, .12);
    }

    input.invalid {
      border-color: #d92d20;
      background: #fffafa;
    }

    input.valid {
      border-color: #12b76a;
    }

    .hint {
      margin-top: 7px;
      color: #667085;
      font-size: 12px;
      line-height: 1.45;
    }

    .error {
      min-height: 18px;
      margin-top: 6px;
      color: #d92d20;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
    }

    button {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #generateBtn {
      flex: 1;
      color: #fff;
      background: #3867d6;
    }

    #generateBtn:hover {
      background: #2f56b7;
    }

    #clearBtn {
      background: #eef1f6;
      color: #344054;
    }

    .result {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #eaecf0;
    }

    .result.show {
      display: block;
    }

    .result-title {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    .url-output {
      flex: 1;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-all;
      user-select: all;
    }

    #copyBtn {
      flex: 0 0 auto;
      background: #172033;
      color: #fff;
    }

    #copyBtn.copied {
      background: #12b76a;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: #12b76a;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container { padding: 22px; }
      .actions { flex-direction: column; }
      .url-row { flex-direction: column; }
      #copyBtn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>DCX Dynamic URL Generator</h1>
    <p class="subtitle">
      Select the environment and provide the mobile and web URLs to generate an encoded dynamic URL.
    </p>

    <form id="urlForm" novalidate>
      <div class="field">
        <label for="environment">Environment</label>
        <select id="environment">
          <option value="https://go.coindcx.com/dynamic" selected>Production — go.coindcx.com</option>
          <option value="https://go.dcxstage.com/dynamic">Staging — go.dcxstage.com</option>
        </select>
      </div>

      <div class="field">
        <label for="mobileUrl">Mobile URL</label>
        <input
          id="mobileUrl"
          type="text"
          autocomplete="off"
          placeholder="dcxgo://go.coindcx.com/portfolio?tab=coins"
          aria-describedby="mobileHint mobileError"
        />
        <div id="mobileHint" class="hint">
          Example: dcxgo://go.coindcx.com/portfolio?tab=coins
        </div>
        <div id="mobileError" class="error"></div>
      </div>

      <div class="field">
        <label for="webUrl">Web URL</label>
        <input
          id="webUrl"
          type="text"
          autocomplete="off"
          placeholder="https://coindcx.com/cdw?transactionId=1234"
          aria-describedby="webHint webError"
        />
        <div id="webHint" class="hint">
          Example: https://coindcx.com/cdw?transactionId=1234
        </div>
        <div id="webError" class="error"></div>
      </div>

      <div class="actions">
        <button type="submit" id="generateBtn">Generate URL</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
    </form>

    <section class="result" id="result">
      <div class="result-title">Generated URL</div>
      <div class="url-row">
        <div class="url-output" id="generatedUrl"></div>
        <button type="button" id="copyBtn">Copy</button>
      </div>
      <div class="status" id="copyStatus"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("urlForm");
    const environment = document.getElementById("environment");
    const mobileInput = document.getElementById("mobileUrl");
    const webInput = document.getElementById("webUrl");
    const mobileError = document.getElementById("mobileError");
    const webError = document.getElementById("webError");
    const result = document.getElementById("result");
    const generatedUrl = document.getElementById("generatedUrl");
    const copyBtn = document.getElementById("copyBtn");
    const copyStatus = document.getElementById("copyStatus");
    const clearBtn = document.getElementById("clearBtn");

    function validateMobileUrl(value) {
      if (!value.trim()) return "Mobile URL is required.";

      // Expected format:
      // dcxgo://go.coindcx.com/...
      // or
      // dcxgo://go.dcxstage.com/...
      const pattern = /^dcxgo:\/\/(go\.coindcx\.com|go\.dcxstage\.com)\/.+$/i;

      if (!pattern.test(value.trim())) {
        return "Enter a valid mobile URL starting with dcxgo://go.coindcx.com/ or dcxgo://go.dcxstage.com/.";
      }

      return "";
    }

    function validateWebUrl(value) {
      if (!value.trim()) return "Web URL is required.";

      try {
        const url = new URL(value.trim());

        if (url.protocol !== "https:") {
          return "Web URL must use HTTPS.";
        }

        const hostname = url.hostname.toLowerCase();
        const isStaging = environment.value === "https://go.dcxstage.com/dynamic";
        const requiredDomain = isStaging ? "dcxstage.com" : "coindcx.com";

        // The selected environment controls the allowed web domain.
        // Subdomains are allowed, e.g.:
        // https://coindcx.com/...
        // https://www.coindcx.com/...
        // https://something.coindcx.com/...
        const belongsToDomain =
          hostname === requiredDomain ||
          hostname.endsWith("." + requiredDomain);

        if (!belongsToDomain) {
          return `Web URL must belong to ${requiredDomain}. Subdomains are allowed.`;
        }

        if (!url.pathname || url.pathname === "/") {
          return "Web URL must include a path.";
        }
      } catch {
        return "Enter a valid HTTPS web URL.";
      }

      return "";
    }

    function setValidation(input, errorElement, error) {
      input.classList.remove("valid", "invalid");

      if (error) {
        input.classList.add("invalid");
        errorElement.textContent = error;
        return false;
      }

      if (input.value.trim()) {
        input.classList.add("valid");
      }

      errorElement.textContent = "";
      return true;
    }

    function validateAll() {
      const mobileValid = setValidation(
        mobileInput,
        mobileError,
        validateMobileUrl(mobileInput.value)
      );

      const webValid = setValidation(
        webInput,
        webError,
        validateWebUrl(webInput.value)
      );

      return mobileValid && webValid;
    }

    mobileInput.addEventListener("input", () => {
      setValidation(
        mobileInput,
        mobileError,
        validateMobileUrl(mobileInput.value)
      );
      result.classList.remove("show");
      copyStatus.textContent = "";
    });

    webInput.addEventListener("input", () => {
      setValidation(
        webInput,
        webError,
        validateWebUrl(webInput.value)
      );
      result.classList.remove("show");
      copyStatus.textContent = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!validateAll()) {
        result.classList.remove("show");

        const firstInvalid = document.querySelector("input.invalid");
        if (firstInvalid) firstInvalid.focus();
        return;
      }

      const baseUrl = environment.value;
      const mobileUrl = mobileInput.value.trim();
      const webUrl = webInput.value.trim();

      // Encode each complete URL before appending it to the selected environment.
      const finalUrl =
        `${baseUrl}?mobile_url=${encodeURIComponent(mobileUrl)}` +
        `&web_url=${encodeURIComponent(webUrl)}`;

      generatedUrl.textContent = finalUrl;
      result.classList.add("show");
      copyStatus.textContent = "";
      copyBtn.textContent = "Copy";
      copyBtn.classList.remove("copied");
    });

    copyBtn.addEventListener("click", async () => {
      const value = generatedUrl.textContent;

      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      copyBtn.textContent = "Copied";
      copyBtn.classList.add("copied");
      copyStatus.textContent = "URL copied to clipboard.";

      setTimeout(() => {
        copyBtn.textContent = "Copy";
        copyBtn.classList.remove("copied");
      }, 1800);
    });

    environment.addEventListener("change", () => {
      setValidation(
        webInput,
        webError,
        validateWebUrl(webInput.value)
      );
      result.classList.remove("show");
      copyStatus.textContent = "";
    });

    clearBtn.addEventListener("click", () => {
      form.reset();
      environment.value = "https://go.coindcx.com/dynamic";
      mobileInput.classList.remove("valid", "invalid");
      webInput.classList.remove("valid", "invalid");
      mobileError.textContent = "";
      webError.textContent = "";
      result.classList.remove("show");
      generatedUrl.textContent = "";
      copyStatus.textContent = "";
      copyBtn.textContent = "Copy";
      copyBtn.classList.remove("copied");
      mobileInput.focus();
    });
  </script>
</body>
</html>
